[pytest]
# Automatically use asyncio for async tests
asyncio_mode = auto

# Default options: quiet, stop on first fail, 10s timeout per test
addopts = -q --maxfail=1 --timeout=10

# Register custom markers for test categorization
markers =
    unit: Fast tests, no network or I/O.
    integration: Tests that may touch local DB/Redis.
    e2e: End-to-end tests that hit external services (skipped by default).

# Filter out common warnings to keep test output clean
filterwarnings =
    ignore::DeprecationWarning
